<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စိတ်ဆိုးပြေတော့နော် ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #fbcfe8 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, sans-serif;
            position: relative;
        }

        .bg-floating-heart {
            position: absolute;
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 5;
        }

        .page.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .card {
            background: transparent;
            padding: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            color: #0284c7;
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        p {
            color: #475569;
            font-size: 1.05rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .media-container {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .media-container img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn-no {
            background-color: #cbd5e1;
            color: #334155;
            box-shadow: none;
        }

        .btn.centered-final-btn {
            transform: scale(1) !important;
            padding: 14px 35px;
            font-size: 1.15rem;
            background: linear-gradient(135deg, #0284c7 0%, #8b5cf6 100%);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        /* Page 2 Styles */
        .page-2 {
            position: relative;
        }

        .sticker {
            position: absolute;
            bottom: 40px;
            width: 90px;
            height: 90px;
            object-fit: contain;
            z-index: 5;
        }

        .sticker.left { left: 50px; }
        .sticker.right { 
            right: 50px; 
            transform: scaleX(-1);
        }

        /* အောက်ဘက် ရွေ့လျားမည့် စတစ်ကာ - အဆုံးထိရောက်မှ တစ်ပတ်လှည့်မည့် ပုံစံ */
        .sticker.moving {
            bottom: 30px;
            animation: moveAndRotateAtEnds 6s ease-in-out infinite alternate;
            z-index: 6;
        }

        @keyframes moveAndRotateAtEnds {
            0% {
                left: 15%;
                transform: scaleX(1) rotate(0deg);
            }
            47% {
                transform: scaleX(1) rotate(0deg);
            }
            50% {
                /* ညာဘက်အဆုံးသို့ ရောက်ချိန်တွင် တစ်ပတ် (360deg) လှည့်ခြင်း */
                left: 70%;
                transform: scaleX(-1) rotate(360deg);
            }
            97% {
                transform: scaleX(-1) rotate(360deg);
            }
            100% {
                /* ဘယ်ဘက်အဆုံးသို့ ပြန်ရောက်ချိန်တွင် တစ်ပတ်ပြန်လှည့်ခြင်း */
                left: 15%;
                transform: scaleX(1) rotate(720deg);
            }
        }

        @media (max-width: 768px) {
            .sticker { width: 70px; height: 70px; bottom: 20px; }
            .sticker.left { left: 20px; }
            .sticker.right { right: 20px; transform: scaleX(-1); }
            .sticker.moving { bottom: 15px; }
        }

        .center-text {
            color: #0284c7;
            font-size: 3rem;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1.5s ease-in-out;
            z-index: 10;
            text-align: center;
        }

        .center-text.show {
            opacity: 1;
            transform: scale(1);
            text-shadow: 0 0 25px rgba(2, 132, 199, 0.4);
        }

        .flying-heart {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            z-index: 2;
            animation: arcFly 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes arcFly {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            50% { transform: translate(var(--mid-x), var(--mid-y)) scale(1.2); opacity: 0.9; }
            100% { transform: translate(var(--dest-x), var(--dest-y)) scale(1); opacity: 0; }
        }

        .next-arrow {
            position: absolute;
            bottom: 40px;
            right: 50px;
            background: #0284c7;
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .next-arrow:hover { transform: scale(1.1); background: #0369a1; }

        /* Page 3 Styles */
        .page-3 {
            position: relative;
            overflow: hidden;
            padding: 0 !important;
        }

        .envelope-full-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .envelope-bg-img {
            width: 75%;
            max-width: 450px;
            height: auto;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .instruction-banner-overlay {
            position: absolute;
            bottom: 35px;
            background: rgba(2, 132, 199, 0.85);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            z-index: 10;
            animation: pulseBanner 1.5s infinite;
        }

        @keyframes pulseBanner {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Page 4 Styles */
        .page-4 {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #fbcfe8 100%);
            position: relative;
            padding: 20px !important;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .letter-paper {
            width: 90%;
            max-width: 550px;
            height: 75vh;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: fadeInUp 0.8s ease forwards;
            z-index: 10;
        }

        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .letter-paper h2 {
            color: #0284c7;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-family: 'Segoe UI', cursive, sans-serif;
        }

        .letter-paper p {
            color: #1e293b;
            font-size: 1.05rem;
            line-height: 1.8;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .letter-btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .letter-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .letter-btn:hover { background: #0369a1; transform: scale(1.05); }
        .letter-btn-close { background: #64748b; }
        .letter-btn-close:hover { background: #475569; }

        .firework-particle {
            position: fixed;
            font-size: 22px;
            pointer-events: none;
            z-index: 999;
            animation: fireworkExplosion 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes fireworkExplosion {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- နောက်ခံသီချင်း (Web ဖွင့်လိုက်သည်နှင့် အလိုအလျောက် ဖွင့်မည်) -->
    <audio id="bgMusic" loop>
        <source src="du.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-floating-heart" style="left: 10%; animation-delay: 0s;">💖</div>
    <div class="bg-floating-heart" style="left: 25%; animation-delay: 2s;">☁️</div>
    <div class="bg-floating-heart" style="left: 40%; animation-delay: 1s;">🌸</div>
    <div class="bg-floating-heart" style="left: 60%; animation-delay: 3s;">☁️</div>
    <div class="bg-floating-heart" style="left: 75%; animation-delay: 1.5s;">💙</div>
    <div class="bg-floating-heart" style="left: 90%; animation-delay: 2.5s;">✨</div>

    <!-- ================= PAGE 1 ================= -->
    <div class="page active" id="page1">
        <div class="card">
            <h1>စိတ်ဆိုးနေသေးလားဟင်... 🥺</h1>
            
            <div class="media-container">
                <img src="mi.gif" alt="Cute GIF">
            </div>

            <p>စိတ်ဆိုးပြေတော့နော်....💙</p>

            <div class="btn-group" id="btnGroup">
                <button class="btn btn-no" id="noBtn" onclick="handleNoClick(event)">ဆိုးတယ်</button>
                <button class="btn" id="yesBtn" onclick="handleYesClick(event)">မဆိုးတော့ဘူး </button>
            </div>
        </div>
    </div>

    <!-- ================= PAGE 2 ================= -->
    <div class="page page-2" id="page2">
        <img src="love.webp" class="sticker left" id="leftSticker" alt="Sticker">
        <img src="love.webp" class="sticker right" id="rightSticker" alt="Sticker">
        <!-- အောက်ဘက်တွင် ဘယ်မှညာသို့ ရွေ့လျားမည့် စတစ်ကာအသစ် -->
        <img src="dudu.webp" class="sticker moving" id="movingSticker" alt="Sticker">

        <div class="center-text" id="sorryText">Sorry🥺</div>

        <button class="next-arrow" id="nextArrow" onclick="goToPage3()">➔</button>
    </div>

    <!-- ================= PAGE 3 ================= -->
    <div class="page page-3" id="page3">
        <div class="envelope-full-container" onclick="goToPage4()">
            <img src="en.jpg" alt="Envelope Background" class="envelope-bg-img">
            <div class="instruction-banner-overlay">💌 ဤစာအိတ်လေးကို နှိပ်ပါ 💌</div>
        </div>
    </div>

    <!-- ================= PAGE 4 ================= -->
    <div class="page page-4" id="page4">
        <div class="letter-paper" id="letterContentBox">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        let clickCount = 0;
        const maxClicks = 5;

        // Browser ၏ အလိုအလျောက် သီချင်းပိတ်ထားတတ်သော စနစ် (Autoplay Policy) ကို ကျော်လွန်ပြီး 
        // မျက်နှာပြင်ပေါ်ရှိ မည်သည့်နေရာကိုမဆို ပထမဆုံးအကြိမ် နှိပ်လိုက်သည်နှင့် သီချင်းစတင်ပွင့်စေရန်
        document.addEventListener('click', function() {
            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play().catch(error => {
                    console.log("Audio play prevented: ", error);
                });
            }
        }, { once: true });

        function handleNoClick(event) {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            createFireworks(event, ['💔', '💔', '💔', '💔', '💔']);

            if (clickCount === 1) {
                yesBtn.innerText = "မဆိုးတော့ဘူး";
                yesBtn.style.transform = `scale(1.15)`;
            } else if (clickCount === 2) {
                yesBtn.innerText = "မဆိုးပါနဲ့တော့ 🥺";
                yesBtn.style.transform = `scale(1.3)`;
            } else if (clickCount === 3) {
                yesBtn.innerText = "မဆိုးဘူး 🤪";
                yesBtn.style.transform = `scale(1.45)`;
            } else if (clickCount === 4) {
                yesBtn.innerText = "မဆိုးပါနဲ့ဆို 😭";
                yesBtn.style.transform = `scale(1.6)`;
            } else if (clickCount >= maxClicks) {
                yesBtn.innerText = "မဆိုးတော့ဘူးမလား ဟိဟိ 💙";
                yesBtn.classList.add('centered-final-btn');
                noBtn.style.display = 'none'; 
            }
        }

        function handleYesClick(event) {
            createFireworks(event, ['💖', '💘', '✨', '🌸', '💙']);
            setTimeout(() => {
                goToPage2();
            }, 600);
        }

        function createFireworks(event, emojiList) {
            const count = 25; 
            const clientX = event.clientX || (window.innerWidth / 2);
            const clientY = event.clientY || (window.innerHeight / 2);

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework-particle');
                particle.innerHTML = emojiList[Math.floor(Math.random() * emojiList.length)];
                
                particle.style.left = clientX + 'px';
                particle.style.top = clientY + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 140;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }

        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            startStickerArcAnimation();
        }

        function goToPage3() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page3').classList.add('active');
        }

        function goToPage4() {
            document.getElementById('page3').classList.remove('active');
            document.getElementById('page4').classList.add('active');
            showFirstLetterPage();
        }

        function startStickerArcAnimation() {
            const leftSticker = document.getElementById('leftSticker');
            const rightSticker = document.getElementById('rightSticker');
            const movingSticker = document.getElementById('movingSticker');
            
            const interval = setInterval(() => {
                createArcHeart(leftSticker, true);
                createArcHeart(rightSticker, false);
                createArcHeart(movingSticker, Math.random() > 0.5);
            }, 120);

            setTimeout(() => {
                clearInterval(interval);
                document.getElementById('sorryText').classList.add('show');
                document.getElementById('nextArrow').style.display = 'flex';
            }, 3200);
        }

        function createArcHeart(stickerElement, isLeft) {
            const rect = stickerElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const heart = document.createElement('div');
            heart.classList.add('flying-heart');
            heart.innerHTML = '💙';
            heart.style.left = startX + 'px';
            heart.style.top = startY + 'px';

            const destX = centerX - startX + (Math.random() - 0.5) * 100;
            const destY = centerY - startY + (Math.random() - 0.5) * 60;
            const midX = destX * 0.5 + (isLeft ? 50 : -50);
            const midY = destY * 0.3 - 100;

            heart.style.setProperty('--mid-x', midX + 'px');
            heart.style.setProperty('--mid-y', midY + 'px');
            heart.style.setProperty('--dest-x', destX + 'px');
            heart.style.setProperty('--dest-y', destY + 'px');

            document.getElementById('page2').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 2500);
        }

        function showFirstLetterPage() {
            const box = document.getElementById('letterContentBox');
            box.innerHTML = `
                <h2>Happy Forever! ✨</h2>
                <p>
                    ဒီစာလေးကို ဖတ်နေရပြီဆိုရင် မောင့်ဘက်က တကယ်ကို စိတ်ရင်းမှန်နဲ့ တောင်းပန်ပါတယ်နော်။ မောင့်အမှားအတွက် စိတ်မကောက်ပါနဲ့တော့နော်... အမြဲတမ်း မောင့်ဘေးမှာ ရှိနေပေးပါ။ 💙
                </p>
                <div class="letter-btn-group">
                    <button class="letter-btn" onclick="showSecondLetterPage()">ဆက်ဖတ်ရန် ✨</button>
                    <button class="letter-btn letter-btn-close" onclick="restartWebsite()">ပြန်စမည် 🔄</button>
                </div>
            `;
        }

        function showSecondLetterPage() {
            const box = document.getElementById('letterContentBox');
            box.innerHTML = `
                <h2>Chit tl Ma Ma Thoon Eain Si 💌</h2>
                <p>
                    တကယ်တော့ မောင်က မမကိုချစ်လို့၊ အခုလိုတွေ ဖြစ်သွားရတာပါ စိတ်မဆိုးပါနဲ့တော့နော် မောင်တောင်းပန်ပါတယ်... နောက်ဆို ဒီလိုအမှားမျိုး ထပ်မလုပ်တော့ပါဘူး။ အမြဲတမ်း ပျော်ပျော်ရွှင်ရွှင်နဲ့ မောင့်ဘေးနားမှာ ရှိနေပေးပါ။ အရမ်းချစ်တယ်နော်... 💙💙💙
                </p>
                <div class="letter-btn-group">
                    <button class="letter-btn letter-btn-close" onclick="restartWebsite()">အစမှ ပြန်စမည် 🔄</button>
                </div>
            `;
        }

        function restartWebsite() {
            document.getElementById('page4').classList.remove('active');
            document.getElementById('page1').classList.add('active');
            clickCount = 0;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('centered-final-btn');
            yesBtn.style.transform = 'scale(1)';
            yesBtn.innerText = "မဆိုးတော့ဘူး ";
            document.getElementById('noBtn').style.display = 'inline-block';
            document.getElementById('sorryText').classList.remove('show');
            document.getElementById('nextArrow').style.display = 'none';
        }
    </script>

</body>
</html>n
